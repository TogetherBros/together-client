name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux 의존성 설치
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 의존성 설치
        run: npm install

      - name: Tauri 빌드 및 릴리즈
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Together ${{ github.ref_name }}'
          releaseBody: '빌드 중...'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  organize:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 릴리즈 노트 OS별 정리
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name] | sort | .[]')

          WIN_EXE=$(echo "$ASSETS"  | grep -E '\.exe$'      | grep -v '\.sig$' || true)
          WIN_MSI=$(echo "$ASSETS"  | grep -E '\.msi$'      | grep -v '\.sig$' || true)
          MAC_INT=$(echo "$ASSETS"  | grep '\.dmg$'         | grep -v 'aarch64' || true)
          MAC_ARM=$(echo "$ASSETS"  | grep '\.dmg$'         | grep 'aarch64'    || true)
          LINUX_D=$(echo "$ASSETS"  | grep '\.deb$'         || true)
          LINUX_R=$(echo "$ASSETS"  | grep '\.rpm$'         || true)
          LINUX_A=$(echo "$ASSETS"  | grep '\.AppImage$'    || true)

          make_links() {
            local label="$1"; shift
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              URL="https://github.com/$REPO/releases/download/$TAG/$f"
              if [ -n "$label" ]; then
                echo "- [\`$f\`]($URL) — $label"
              else
                echo "- [\`$f\`]($URL)"
              fi
            done
          }

          NOTES="## 다운로드"$'\n\n'

          NOTES+="### Windows"$'\n'
          NOTES+=$(echo "$WIN_EXE" | make_links "설치 프로그램")$'\n'
          NOTES+=$(echo "$WIN_MSI" | make_links "MSI 패키지")$'\n'
          NOTES+=$'\n'

          NOTES+="### macOS"$'\n'
          NOTES+=$(echo "$MAC_INT" | make_links "Intel")$'\n'
          NOTES+=$(echo "$MAC_ARM" | make_links "Apple Silicon")$'\n'
          NOTES+=$'\n'

          NOTES+="### Linux"$'\n'
          NOTES+=$(echo "$LINUX_D" | make_links ".deb (Debian / Ubuntu / Kali)")$'\n'
          NOTES+=$(echo "$LINUX_R" | make_links ".rpm (Fedora / RHEL)")$'\n'
          NOTES+=$(echo "$LINUX_A" | make_links "AppImage (범용)")$'\n'

          printf '%s' "$NOTES" | gh release edit "$TAG" --repo "$REPO" --notes-file -
